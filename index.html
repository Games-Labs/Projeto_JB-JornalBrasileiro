<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornal Brasileiro (JB) — Informação e Investigação</title>
    <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <meta name="description" content="Jornal Brasileiro (JB): portal de webjornalismo informativo e investigativo (projeto acadêmico).">

    <!-- Fontes (opcionais: há fallback para fontes do sistema) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap local (primeiro) + tema do JB (depois, para poder sobrescrever) -->
    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>try{if(localStorage.getItem('jb_theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
</head>
<body data-root="" data-page="inicio">

    <div id="site-top"></div>

    <main class="container main-layout">
        <section class="row g-4">
            <article class="col-lg-8 lead-story" id="lead-story"></article>
            <aside class="col-lg-4">
                <h2 class="section-title">Últimas Publicações</h2>
                <div id="latest-news"></div>
                <a href="pages/noticias.html" class="btn btn-outline-dark btn-sm">Ver todas as notícias</a>
                <div id="most-read" class="mt-4" hidden>
                    <h2 class="section-title">Mais lidas</h2>
                    <ol class="most-read-list" id="most-read-list"></ol>
                </div>
            </aside>
        </section>

        <hr class="editorial-divider">

        <section aria-labelledby="destaques">
            <div class="d-flex justify-content-between align-items-baseline mb-3">
                <h2 class="section-title flex-grow-1 me-3" id="destaques">Destaques do Dia</h2>
                <span class="edition-date" id="edition-date"></span>
            </div>
            <div class="row g-4" id="feed-grid"></div>
        </section>

        <hr class="editorial-divider">

        <section class="whistleblower-box">
            <div class="row g-4 align-items-center">
                <div class="col-lg-8">
                    <span class="badge-urgente">CANAL SEGURO</span>
                    <h2>Denuncie ou Envie uma Pauta</h2>
                    <p class="mb-0">Tem documentos, imagens ou informações de interesse público? Envie pelo nosso canal, com opção de anonimato.</p>
                </div>
                <div class="col-lg-4 text-lg-end"><a href="pages/denuncias.html" class="btn btn-primary btn-lg">Enviar Denúncia</a></div>
            </div>
        </section>
    </main>

    <div id="site-bottom"></div>

    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/home.js"></script>
</body>
</html>

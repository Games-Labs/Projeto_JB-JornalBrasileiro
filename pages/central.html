<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Minha Central — Jornal Brasileiro (JB)</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <!-- Fontes hospedadas no próprio site (Source Serif 4 e Inter, licença OFL): sem pedidos ao Google -->
    <link rel="preload" href="../assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script>try{var d=document.documentElement,s=localStorage;if(s.getItem('jb_theme')==='dark')d.setAttribute('data-bs-theme','dark');var a=JSON.parse(s.getItem('jb_a11y')||'{}')||{};if(a.font>0&&a.font<4)d.setAttribute('data-font',String(a.font|0));if(a.contrast)d.setAttribute('data-contrast','high')}catch(e){}</script>
</head>
<body data-root="../" data-page="central">
    <div id="site-top"></div>
    <main class="container main-layout">
        <h1 class="page-title">Minha Central</h1>
        <p class="page-lead">Seus favoritos, seu histórico de leitura e sugestões. <span id="storage-info"></span></p>

        <section class="mb-5">
            <h2 class="section-title">Recomendadas para você</h2>
            <p class="small text-muted" id="reco-info"></p>
            <div class="row g-4" id="reco"><div class="col-12"><div class="jb-loading" role="status"><span class="jb-spinner" aria-hidden="true"></span>Carregando…</div></div></div>
        </section>

        <section class="mb-5">
            <h2 class="section-title">Favoritos (<span id="fav-count">0</span>)</h2>
            <div class="row g-4" id="favs"></div>
        </section>

        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-baseline">
                <h2 class="section-title flex-grow-1 me-3">Histórico de leitura</h2>
                <button class="btn btn-outline-dark btn-sm" id="clear-history" type="button">Limpar histórico</button>
            </div>
            <div class="row g-4" id="history"></div>
        </section>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/supabase/supabase.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/supabase-backend.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/central.js"></script>
</body>
</html>

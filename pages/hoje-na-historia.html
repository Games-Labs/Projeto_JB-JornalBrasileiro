<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Hoje na História: acontecimentos que marcaram esta data no Brasil e no mundo, com dados da Wikipédia.">
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <!-- Fontes hospedadas no próprio site (Source Serif 4 e Inter, licença OFL): sem pedidos ao Google -->
    <link rel="preload" href="../assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/motion.css">
    <script>try{var d=document.documentElement,s=localStorage;if(s.getItem('jb_theme')==='dark')d.setAttribute('data-bs-theme','dark');var a=JSON.parse(s.getItem('jb_a11y')||'{}')||{};if(a.font>0&&a.font<4)d.setAttribute('data-font',String(a.font|0));if(a.contrast)d.setAttribute('data-contrast','high')}catch(e){}</script>
</head>
<body data-root="../" data-page="hoje-na-historia">
    <div id="site-top"></div>
    <main class="container main-layout svc-page svc-history">
        <h1 class="page-title" id="hist-title">Hoje na História</h1>
        <p class="page-lead">Acontecimentos que marcaram esta data, do mais recente ao mais antigo.</p>
        <div class="hist-toolbar">
            <label class="form-label mb-0" for="hist-date">Escolher outro dia</label>
            <input type="date" class="form-control form-control-sm w-auto" id="hist-date" min="2024-01-01" max="2024-12-31">
            <button type="button" class="btn btn-sm btn-outline-dark" id="hist-today">Hoje</button>
            <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="hist-br"><label class="form-check-label small" for="hist-br">Só fatos ligados ao Brasil</label></div>
        </div>
        <section class="panel-box" id="hist-main" aria-live="polite"><div class="jb-loading" role="status"><span class="jb-spinner" aria-hidden="true"></span>Carregando…</div></section>
        <div id="hist-updated" class="mt-2"></div>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/supabase/supabase.js"></script>
    <script src="../assets/js/config.js"></script>

    <script src="../assets/js/services.js"></script>

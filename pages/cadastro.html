<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Jornal Brasileiro (JB)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-page="login">
    <div id="site-top"></div>
    <main class="container main-layout">
        <div class="auth-card">
            <h1 class="h3 mb-3">Criar conta</h1>
            <div class="alert alert-danger" id="form-error" role="alert" hidden></div>
            <form id="register-form">
                <div class="mb-3"><label class="form-label" for="name">Nome completo</label><input type="text" class="form-control" id="name" name="name" autocomplete="name" required></div>
                <div class="mb-3"><label class="form-label" for="email">E-mail</label><input type="email" class="form-control" id="email" name="email" autocomplete="username" required></div>
                <div class="mb-3"><label class="form-label" for="password">Senha (mín. 6 caracteres)</label><input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="6" required></div>
                <div class="mb-3"><label class="form-label" for="confirm">Confirmar senha</label><input type="password" class="form-control" id="confirm" name="confirm" autocomplete="new-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
            </form>
            <p class="mt-3 mb-0 text-center">Já tem conta? <a href="login.html">Entrar</a></p>
            <p class="small text-center text-muted mt-2 mb-0">Cadastro simulado: os dados ficam somente neste navegador.</p>
        </div>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#941F2B">
    <meta name="robots" content="noindex">
    <title>Comentários — Painel — Jornal Brasileiro (JB)</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <!-- Fontes hospedadas no próprio site (Source Serif 4 e Inter, licença OFL): sem pedidos ao Google -->
    <link rel="preload" href="../assets/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/motion.css">
    <script>try{var d=document.documentElement,s=localStorage;if(s.getItem('jb_theme')==='dark')d.setAttribute('data-bs-theme','dark');var a=JSON.parse(s.getItem('jb_a11y')||'{}')||{};if(a.font>0&&a.font<4)d.setAttribute('data-font',String(a.font|0));if(a.contrast)d.setAttribute('data-contrast','high')}catch(e){}</script>
</head>
<body data-root="../" data-page="admin" data-admin="comentarios">
    <div id="site-top"></div>
    <main class="container-fluid admin-main main-layout">
        <div id="admin-loading" class="jb-loading" role="status"><span class="jb-spinner" aria-hidden="true"></span>Carregando o painel…</div>
        <div id="admin-error"></div>
        <div id="gate" class="auth-card text-center" hidden>
            <h1 class="h3">Área restrita</h1>
            <p>O Painel Administrativo é exclusivo para a equipe (jornalistas, professores do JB Educa, coordenadores e administradores).</p>
            <a class="btn btn-primary" href="login.html?next=admin.html">Entrar com uma conta da redação</a>
        </div>

        <div id="panel" class="admin-shell" hidden>
            <nav class="admin-nav" id="admin-nav" aria-label="Seções do painel"></nav>
            <div class="admin-content">
                <header class="admin-head">
                    <p class="admin-kicker">Painel Administrativo</p>
                    <h1 class="page-title">Comentários</h1>
                    <p class="page-lead">Moderação dos comentários de todas as matérias.</p>
                </header>
                <div class="role-note mb-3" id="role-note"></div>
                <div class="alert" id="admin-msg" role="status" hidden></div>
                <div id="admin-section">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
                <input type="search" class="form-control form-control-sm admin-filter" id="comment-q" placeholder="Filtrar por nome ou texto" aria-label="Filtrar comentários">
                <span class="small text-muted" id="comments-count"></span>
            </div>
            <div id="comment-rows"></div>
                </div>
            </div>
        </div>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/supabase/supabase.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/supabase-backend.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/motion.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>

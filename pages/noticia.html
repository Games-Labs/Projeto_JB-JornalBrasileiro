<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matéria — Jornal Brasileiro (JB)</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script>try{var d=document.documentElement,s=localStorage;if(s.getItem('jb_theme')==='dark')d.setAttribute('data-bs-theme','dark');var a=JSON.parse(s.getItem('jb_a11y')||'{}')||{};if(a.font>0&&a.font<4)d.setAttribute('data-font',String(a.font|0));if(a.contrast)d.setAttribute('data-contrast','high')}catch(e){}</script>
</head>
<body data-root="../" data-page="noticias">
    <div id="site-top"></div>
    <main class="container main-layout">
        <article id="article"><div class="jb-loading" role="status"><span class="jb-spinner" aria-hidden="true"></span>Carregando a matéria…</div></article>
        <section id="comments-wrap" class="mt-5 no-print" hidden>
            <hr class="editorial-divider">
            <h2 class="section-title">Comentários (<span id="comment-count">0</span>)</h2>
            <p class="small text-muted">Os comentários são públicos e moderados pelo editor. Não publique dados pessoais.</p>
            <form id="comment-form" class="panel-box mb-3" novalidate>
                <div class="row g-3">
                    <div class="col-md-4"><label class="form-label" for="c-name">Nome</label><input class="form-control" id="c-name" name="name" maxlength="60" required><div class="form-text" id="c-name-help" hidden>Você está logado: o comentário usa o nome da sua conta.</div><div class="invalid-feedback">Informe seu nome.</div></div>
                    <div class="col-md-8"><label class="form-label" for="c-text">Comentário</label><textarea class="form-control" id="c-text" name="text" rows="2" maxlength="500" required></textarea><div class="invalid-feedback">Escreva o comentário.</div></div>
                </div>
                <button class="btn btn-primary btn-sm mt-3" type="submit">Comentar</button>
            </form>
            <div id="comment-list"></div>
        </section>
        <div id="related-wrap" hidden>
            <hr class="editorial-divider">
            <h2 class="section-title">Leia também</h2>
            <div class="row g-4" id="related"></div>
        </div>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/vendor/supabase/supabase.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/supabase-backend.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/article.js"></script>
</body>
</html>

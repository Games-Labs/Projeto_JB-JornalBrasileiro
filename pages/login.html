<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Jornal Brasileiro (JB)</title>
    <link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script>try{if(localStorage.getItem('jb_theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
</head>
<body data-root="../" data-page="login">
    <div id="site-top"></div>
    <main class="container main-layout">
        <div class="auth-card">
            <h1 class="h3 mb-3">Entrar</h1>
            <div class="alert alert-danger" id="form-error" role="alert" hidden></div>
            <form id="login-form">
                <div class="mb-3"><label class="form-label" for="email">E-mail</label><input type="email" class="form-control" id="email" name="email" autocomplete="username" required></div>
                <div class="mb-3"><label class="form-label" for="password">Senha</label><input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>
            <p class="mt-3 mb-1 text-center">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            <p class="small text-center text-muted mb-0">Demonstração do editor: <code>admin@jb.com.br</code> / <code>admin123</code></p>
        </div>
    </main>
    <div id="site-bottom"></div>
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
